apiVersion: batch/v1
kind: Job
metadata:
  generateName: pihole-prepull-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pull
        image: "{{ .Values.pihole.image.repository }}:{{ .Values.pihole.image.tag }}"
        command: ["/bin/true"]
