apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kopia.fullname" . }}-backup
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "kopia.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          containers:
            - name: kopia
              image: {{ .Values.image }}
              # connect-or-create + policy, then snapshot. Overrides the image's
              # kopia entrypoint so we can run the bootstrap script first.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  sh /scripts/connect.sh
                  echo ">>> snapshot result (json):"
                  # --json emits the snapshot manifest + stats (file count, size,
                  # errors, duration) to the Job log; exit code drives Job status.
                  kopia snapshot create "$KOPIA_SOURCE_PATH" --json
              envFrom:
                - configMapRef:
                    name: {{ include "kopia.fullname" . }}-env
                - secretRef:
                    name: {{ .Values.repo.secretName }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /app/config
                - name: cache
                  mountPath: /app/cache
                - name: logs
                  mountPath: /app/logs
                - name: source
                  mountPath: {{ .Values.source.path }}
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: {{ include "kopia.fullname" . }}-scripts
            - name: config
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: logs
              emptyDir: {}
            - name: source
              persistentVolumeClaim:
                claimName: {{ include "kopia.fullname" . }}-source
                readOnly: true
