{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kopia.fullname" . }}-server
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # Default 0 — the UI does periodic S3 polling (billed), so keep it scaled to
  # zero and scale up on demand (`just kopia-ui <target>`). Backups run via the
  # CronJob regardless.
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kopia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "kopia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      initContainers:
        # connect-or-create + policy; writes repository.config to the shared
        # config volume the server then reads.
        - name: connect
          image: {{ .Values.image }}
          command: ["/bin/sh", "/scripts/connect.sh"]
          envFrom:
            - configMapRef:
                name: {{ include "kopia.fullname" . }}-env
            - secretRef:
                name: {{ .Values.repo.secretName }}
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: config, mountPath: /app/config }
            - { name: cache, mountPath: /app/cache }
            - { name: logs, mountPath: /app/logs }
      containers:
        - name: kopia
          image: {{ .Values.image }}
          # UI only — no scheduling (the CronJob drives snapshots). TLS is
          # terminated at traefik; auth is enforced by the forwardAuth middleware.
          args:
            - server
            - start
            - --address=0.0.0.0:{{ .Values.server.port }}
            - --insecure
            - --without-password
            - --disable-csrf-token-checks
            - --allow-extremely-dangerous-unauthenticated-server-on-the-network
          envFrom:
            - configMapRef:
                name: {{ include "kopia.fullname" . }}-env
            - secretRef:
                name: {{ .Values.repo.secretName }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          volumeMounts:
            - { name: config, mountPath: /app/config }
            - { name: cache, mountPath: /app/cache }
            - { name: logs, mountPath: /app/logs }
            - name: source
              mountPath: {{ .Values.source.path }}
              readOnly: true
      volumes:
        - { name: scripts, configMap: { name: {{ include "kopia.fullname" . }}-scripts } }
        - { name: config, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - name: source
          persistentVolumeClaim:
            claimName: {{ include "kopia.fullname" . }}-source
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kopia.fullname" . }}-server
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "kopia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kopia.fullname" . }}
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.server.clusterIssuer }}
    # authentik SSO via the shared forwardAuth middleware.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.server.authMiddleware }}
spec:
  ingressClassName: {{ .Values.server.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.server.host | quote }}
      secretName: {{ include "kopia.fullname" . }}-tls
  rules:
    - host: {{ .Values.server.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kopia.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
{{- end }}
