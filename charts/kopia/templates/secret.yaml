apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.repo.secretName }}
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.repo.awsAccessKeyId }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.repo.awsSecretAccessKey }}
  KOPIA_PASSWORD: {{ .Values.repo.kopiaPassword }}
  KOPIA_BUCKET: {{ .Values.repo.kopiaBucket }}
