apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oci-registry
  annotations:
    {{- if .Values.oci_registry.clusterIssuer }}
    # cert-manager mints + auto-renews the cert in .spec.tls[].secretName.
    cert-manager.io/cluster-issuer: {{ .Values.oci_registry.clusterIssuer }}
    {{- end }}

spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.oci_registry.cname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oci-registry
            port:
              number: 5000
  tls:
  - hosts:
    - {{ .Values.oci_registry.cname }}  
    secretName: {{ .Values.oci_registry.tlsSecretName }}