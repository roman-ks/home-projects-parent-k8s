apiVersion: v1
kind: Secret
metadata:
  name: authentik-secret
# All keys below are injected as env vars into the authentik server + worker
# pods (the chart's `existingSecret` -> `envFrom: secretRef`). The OAUTH_* vars
# are consumed by blueprints/my-app-provider.yaml via `!Env`.
stringData:
  AUTHENTIK_SECRET_KEY: {{ .Values.authentikSecret.secretKey }}
  AUTHENTIK_POSTGRESQL__HOST: {{ "authentik-postgresql" }}
  AUTHENTIK_POSTGRESQL__USER: {{ .Values.authentikSecret.postgresql.user  }}
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ .Values.authentikSecret.postgresql.password }}
  OAUTH_IMMICH_CLIENT_ID: {{ .Values.immich.oidc.clientId }}
  OAUTH_IMMICH_CLIENT_SECRET: {{ .Values.immich.oidc.clientSecret }}
  OAUTH_MEMOS_CLIENT_ID: {{ .Values.memos.oidc.clientId }}
  OAUTH_MEMOS_CLIENT_SECRET: {{ .Values.memos.oidc.clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-postgresql-secret
stringData:
  username: {{ .Values.authentikSecret.postgresql.user }}
  password: {{ .Values.authentikSecret.postgresql.password }}
