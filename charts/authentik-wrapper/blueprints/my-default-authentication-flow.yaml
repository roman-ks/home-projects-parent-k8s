# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: My - Authentication flow
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Password change flow
    required: false
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Passwordless flow
    required: false
- attrs:
    designation: authentication
    name: My Welcome to authentik!
    title: My Welcome to authentik!
    authentication: none
  identifiers:
    slug: my-authentication-flow
  model: authentik_flows.flow
  id: flow
- attrs:
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.sources.kerberos.auth.KerberosBackend
    - authentik.sources.ldap.auth.LDAPBackend
    - authentik.core.auth.TokenBackend
    configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]
  identifiers:
    name: my-authentication-password
  id: my-authentication-password
  model: authentik_stages_password.passwordstage
- identifiers:
    name: my-authentication-mfa-validation
  id: my-authentication-mfa-validation
  model: authentik_stages_authenticator_validate.authenticatorvalidatestage
- attrs:
    device_classes:
    - webauthn
    last_auth_threshold: seconds=0
    not_configured_action: deny
    webauthn_user_verification: required
  identifiers:
    name: Passwordless WebAuthn
  id: my-passwordless-webauthn
  model: authentik_stages_authenticator_validate.authenticatorvalidatestage
- attrs:
    webauthn_stage: !KeyOf my-passwordless-webauthn
    user_fields:
    - email
    - username
  identifiers:
    name: my-authentication-identification
  id: my-authentication-identification
  model: authentik_stages_identification.identificationstage
- identifiers:
    name: my-authentication-login
  id: my-authentication-login
  model: authentik_stages_user_login.userloginstage
- identifiers:
    order: 10
    stage: !KeyOf my-authentication-identification
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 20
    stage: !KeyOf my-authentication-password
    target: !KeyOf flow
  attrs:
    re_evaluate_policies: true
  id: my-authentication-flow-password-binding
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 30
    stage: !KeyOf my-authentication-mfa-validation
    target: !KeyOf flow
  id: my-authentication-flow-authenticator-validation-binding
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 100
    stage: !KeyOf my-authentication-login
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
- model: authentik_policies_expression.expressionpolicy
  id: my-authentication-flow-password-optional
  identifiers:
    name: my-authentication-flow-password-stage
  attrs:
    expression: |
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # If the user does not have a backend attached to it, they haven't
      # been authenticated yet and we need the password stage
      return not hasattr(flow_plan.context.get("pending_user"), "backend")
- model: authentik_policies_expression.expressionpolicy
  id: my-authentication-flow-authenticator-validate-optional
  identifiers:
    name: my-authentication-flow-authenticator-validate-stage
  attrs:
    expression: |
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # if the authentication method is webauthn (passwordless), then we skip the authenticator
      # validation stage by returning false (true will execute the stage)
      return not (flow_plan.context.get("auth_method") == "auth_webauthn_pwl")
- model: authentik_policies.policybinding
  identifiers:
    order: 10
    target: !KeyOf my-authentication-flow-password-binding
    policy: !KeyOf my-authentication-flow-password-optional
  attrs:
    failure_result: true
- model: authentik_policies.policybinding
  identifiers:
    order: 10
    target: !KeyOf my-authentication-flow-authenticator-validation-binding
    policy: !KeyOf my-authentication-flow-authenticator-validate-optional
  attrs:
    failure_result: true
