# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: My - Certificate Pair, OAuth2 Apps and Providers
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: false
  - model: authentik_crypto.certificatekeypair
    id: custom-root-ca
    identifiers:
      name: custom-root-ca
    attrs:
      name: custom-root-ca
      certificate_data: !File /certs/authentik-signing.crt
      key_data: !File /certs/authentik-signing.key
  - model: authentik_providers_oauth2.oauth2provider
    id: oidc-immich-provider
    identifiers:
      name: oidc-immich-provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: global
      client_id: !Env OAUTH_IMMICH_CLIENT_ID
      client_secret: !Env OAUTH_IMMICH_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: app.immich:///oauth-callback
        - matching_mode: strict
          url: !Format ["https://immich.%s/auth/login", !Env DOMAIN]
        - matching_mode: strict
          url: !Format ["https://immich.%s/user-settings", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !KeyOf custom-root-ca
  - model: authentik_core.application
    identifiers:
      slug: oidc-immich
    attrs:
      provider: !KeyOf oidc-immich-provider
      name: OIDC Immich
  - model: authentik_providers_oauth2.oauth2provider
    id: oidc-memos-provider
    identifiers:
      name: oidc-memos-provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: global
      client_id: !Env OAUTH_MEMOS_CLIENT_ID
      client_secret: !Env OAUTH_MEMOS_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://memos.%s/auth/callback", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !KeyOf custom-root-ca
  - model: authentik_core.application
    identifiers:
      slug: oidc-memos
    attrs:
      provider: !KeyOf oidc-memos-provider
      name: OIDC Memos