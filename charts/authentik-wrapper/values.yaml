authentik:
  authentik:
    existingSecret:
      secretName: authentik-secret
    error_reporting:
      enabled: false
    postgresql:
      auth:
        username: authentik

  server:
    ingress:
      ingressClassName: traefik
      tls:
        - secretName: auth-tls
          hosts:
            - auth.pi.home
      enabled: true
      hosts:
      - auth.pi.home

  postgresql:
    enabled: true
    auth:
      username: authentik
      existingSecret: authentik-postgresql-secret
      secretKeys:
        userPasswordKey: password

  blueprints:
    configMaps:
      - authentik-blueprints
