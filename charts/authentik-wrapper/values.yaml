authentik:
  authentik:
    existingSecret:
      secretName: authentik-secret
    error_reporting:
      enabled: false
    postgresql:
      auth:
        username: authentik

  # Applied to both the server and worker pods. Mounts the OIDC signing keypair
  # (Secret authentik-signing-cert, from the authentik-secrets release) at /certs,
  # where blueprints/my-app-provider.yaml reads it via `!File`.
  global:
    volumes:
      - name: authentik-signing-cert
        secret:
          secretName: authentik-signing-cert
    volumeMounts:
      - name: authentik-signing-cert
        mountPath: /certs
        readOnly: true

  server:
    ingress:
      ingressClassName: traefik
      # cert-manager issues + auto-renews auth-tls from the internal-ca issuer.
      annotations:
        cert-manager.io/cluster-issuer: internal-ca
      tls:
        - secretName: auth-tls
          hosts:
            - auth.pi.home
      enabled: true
      hosts:
      - auth.pi.home

  postgresql:
    enabled: true
    auth:
      username: authentik
      existingSecret: authentik-postgresql-secret
      secretKeys:
        userPasswordKey: password
    primary:
      persistence:
        # Provisioned by the `core` chart's dedicated provisioner onto the
        # encrypted drive (/mnt/drive1/pv). Deploy `just core` first.
        storageClass: encrypted-local-path

  blueprints:
    configMaps:
      - authentik-blueprints
