---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.issuer.caSecretName }}
  namespace: {{ .Release.Namespace | default "cert-manager" }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: pki
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.intermediateSecret.certificate | quote }}
  tls.key: {{ .Values.intermediateSecret.key | quote }}
