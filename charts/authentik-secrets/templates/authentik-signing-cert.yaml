apiVersion: v1
kind: Secret
metadata:
  name: authentik-signing-cert
  namespace: authentik
# Mounted read-only at /certs on the authentik server + worker pods (see
# charts/authentik-wrapper/values.yaml -> authentik.global.volumes). The data
# keys are the on-disk filenames the blueprint reads via
# `!File /certs/authentik-signing.crt` / `.key`.
data:
  authentik-signing.crt: {{ .Values.authentikSecret.signing.crt | b64enc }}
  authentik-signing.key: {{ .Values.authentikSecret.signing.key | b64enc }}
