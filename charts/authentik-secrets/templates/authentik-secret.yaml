apiVersion: v1
kind: Secret
metadata:
  name: authentik-secret
  namespace: authentik
# All keys below are injected as env vars into the authentik server + worker
# pods (the chart's `existingSecret` -> `envFrom: secretRef`). The OAUTH_* vars
# are consumed by blueprints/my-app-provider.yaml via `!Env`.
data:
  AUTHENTIK_SECRET_KEY: {{ .Values.authentikSecret.secretKey | b64enc }}
  AUTHENTIK_POSTGRESQL__HOST: {{ "authentik-postgresql" | b64enc }}
  AUTHENTIK_POSTGRESQL__USER: {{ .Values.authentikSecret.postgresql.user | b64enc }}
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ .Values.authentikSecret.postgresql.password | b64enc }}
  OAUTH_IMMICH_CLIENT_ID: {{ .Values.immich.oidc.clientId | b64enc }}
  OAUTH_IMMICH_CLIENT_SECRET: {{ .Values.immich.oidc.clientSecret | b64enc }}
  OAUTH_MEMOS_CLIENT_ID: {{ .Values.memos.oidc.clientId | b64enc }}
  OAUTH_MEMOS_CLIENT_SECRET: {{ .Values.memos.oidc.clientSecret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-postgresql-secret
  namespace: authentik
data:
  username: {{ .Values.authentikSecret.postgresql.user | b64enc }}
  password: {{ .Values.authentikSecret.postgresql.password | b64enc }}
