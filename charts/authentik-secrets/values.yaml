# Values are supplied at apply time from the sops-encrypted files (see the
# `authentik-secrets` recipe), which is why these are empty placeholders:
#   values/authentik.enc.yaml -> authentikSecret.*
#   values/immich.enc.yaml    -> immich.oidc.*
#   values/memos.enc.yaml     -> memos.oidc.*
authentikSecret:
  secretKey: ""
  postgresql:
    user: authentik
    password: ""
  # OIDC token signing keypair, mounted at /certs and imported by the blueprint
  # as the `custom-root-ca` certificatekeypair. PEM strings (use block scalars):
  #   signing:
  #     crt: |
  #       -----BEGIN CERTIFICATE-----
  #       ...
  #     key: |
  #       -----BEGIN PRIVATE KEY-----
  #       ...
  signing:
    crt: ""
    key: ""

immich:
  oidc:
    clientId: ""
    clientSecret: ""

memos:
  oidc:
    clientId: ""
    clientSecret: ""
