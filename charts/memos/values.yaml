image:
  repository: neosmemo/memos
  tag: stable
  pullPolicy: IfNotPresent

# Public hostname. Used for the ingress host and MEMOS_INSTANCE_URL.
host: memos.pi.home

service:
  port: 5230

ingress:
  className: traefik
  # cert-manager issues + auto-renews this secret from the clusterIssuer below.
  tlsSecretName: memos-tls
  clusterIssuer: internal-ca

persistence:
  storageClass: encrypted-local-path
  size: 5Gi
  # memos stores its sqlite DB + assets here (container path /var/opt/memos).

# Tailnet routing: templates/tailscale-ingress.yaml, a second Ingress
# (ingressClassName: traefik-tailnet) alongside the LAN one above, both
# pointing at the same backend. The original per-app ingressClassName:
# tailscale approach broke on SNI (see ai-fluency/tailscale-tasks-v2.md
# Task 3); its replacement, a shared tailnet-only Traefik instance
# (charts/traefik-tailnet), needed this second Ingress specifically because
# a plain Ingress can't reference a cross-namespace backend.

# NOTE: memos trusts the internal CA via the ca.crt that cert-manager writes into
# the memos-tls secret (mounted at /certs/ca.crt, SSL_CERT_FILE). No manual CA.

resources: {}
