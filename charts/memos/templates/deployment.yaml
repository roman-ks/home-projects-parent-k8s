apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  labels:
    app: memos
spec:
  replicas: 1
  # sqlite lives on a RWO volume — never run two writers at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      # Kubernetes injects MEMOS_PORT=tcp://<svc-ip>:5230 for the `memos` Service,
      # which collides with memos' own MEMOS_PORT config (parsed to 0). Disable the
      # legacy service-link env vars to avoid it.
      enableServiceLinks: false
      containers:
        - name: memos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: MEMOS_INSTANCE_URL
              value: "https://{{ .Values.host }}"
            # Trust the internal CA (cert-manager writes it to memos-tls' ca.crt)
            # so memos reaches authentik's internal-CA TLS on the OIDC backchannel.
            - name: SSL_CERT_FILE
              value: /certs/ca.crt
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
            - name: ca
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
        # ca.crt from memos' own cert-manager-issued cert = the internal CA that
        # also signed authentik. Only ca.crt is projected (never the private key).
        - name: ca
          secret:
            secretName: {{ .Values.ingress.tlsSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
