apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
  labels:
    app: memos
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
