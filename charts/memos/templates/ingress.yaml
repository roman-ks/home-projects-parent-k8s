apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
  labels:
    app: memos
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    # cert-manager mints + auto-renews the cert in .spec.tls[].secretName.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    # CSP upgrade-insecure-requests — matches the old docker-compose Traefik
    # setup. See k3s/server/manifests/upgrade-insecure.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-upgrade-insecure@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memos
                port:
                  number: {{ .Values.service.port }}
