{{- if .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
  labels:
    app: immich
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
{{- else }}
{{- fail "postgres.password is required — supply it via the sops-decrypted values/immich-config.enc.yaml (see `just immich`)" }}
{{- end }}
