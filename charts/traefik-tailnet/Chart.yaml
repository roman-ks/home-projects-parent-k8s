apiVersion: v2
name: traefik-tailnet
description: >-
  Tailnet-only Traefik instance — routes Memos (HTTPS, SNI/Host) and Samba
  (raw TCP) through one shared tailnet address instead of a proxy per
  service. See ai-fluency/tailscale-tasks-v2.md Task 3. Split out from
  tailscale-operator-wrapper because bundling them tangled two unrelated CRD
  problems (a ProxyClass registration race specific to that chart, and a
  Traefik Hub CRD ownership conflict with k3s's own bundled Traefik) into one
  install. Depends on the tailscale-operator release already being deployed
  — needs the tailscale namespace and the operator running to pick up this
  chart's tailscale.com/expose annotation.
type: application
version: 0.1.0
dependencies:
  - name: traefik
    version: "41.1.0"
    repository: https://traefik.github.io/charts
