traefik:
  ports:
    web:
      # Plain :80 unused — nothing here is served over unencrypted HTTP.
      expose:
        default: false
    websecure:
      exposedPort: 443
    # Non-privileged container port mapped to the privileged exposedPort via
    # the Service, same convention the chart already uses for websecure
    # (8443->443) — avoids needing NET_BIND_SERVICE for Traefik's own container.
    smb:
      port: 8445
      exposedPort: 445
      protocol: TCP
      expose:
        default: true
    # Dashboard/API entrypoint (chart default: port 8080, expose.default:
    # false). Overridden to true so it's a real port on this instance's
    # Service — needed for the main Traefik's debug route
    # (k3s/server/manifests/ts-traefik-dashboard-debug.yaml) to reach it
    # in-cluster. Not meant for LAN or tailnet use directly, though since
    # tailscale.com/expose below exposes every port on this Service, it ends
    # up tailnet-reachable too as a side effect — low-stakes (same access
    # model as everything else this instance handles), not worth a second
    # Service just to avoid.
    traefik:
      expose:
        default: true
  api:
    dashboard: true
    # api.dashboard alone doesn't serve anything — Traefik requires either
    # this, or an explicit IngressRoute referencing api@internal, to actually
    # activate the dashboard handler on the entrypoint (confirmed: dashboard
    # returned a bare 404 with just api.dashboard: true set). This instance's
    # own auto-generated dashboard IngressRoute is deliberately left disabled
    # (api@internal can't be referenced cross-instance, which is why the
    # actual debug route lives on the main Traefik instead, in
    # k3s/server/manifests/) — so nothing else activates it. insecure mode
    # (no auth) is an acceptable tradeoff here: this port isn't reachable off
    # -cluster except through the main Traefik's own SSO-gated debug route,
    # though any other pod in the cluster could reach it directly too.
    insecure: true
  providers:
    # Samba (IngressRouteTCP, a Traefik CRD) has no ingressClassName-style
    # filtering available at all — Traefik's own docs recommend namespace
    # scoping for the CRD provider specifically, confirmed via the "service
    # does not exist" error a missing namespace produced earlier for a
    # Service that demonstrably existed and had a ready endpoint. That
    # scoping affects backend Service/Endpoint visibility too, not just
    # which namespaces get watched for IngressRoute/IngressRouteTCP objects
    # — samba's namespace needs to be listed even though it has no CRD
    # objects of its own, just a plain Service allowCrossNamespace lets this
    # reference.
    kubernetesCRD:
      namespaces:
        - tailscale
        - samba
      allowCrossNamespace: true
    # Memos moved to a plain Ingress instead (charts/memos/templates/
    # tailscale-ingress.yaml) — ingressClassName filtering for plain Ingress
    # IS well-documented and reliable (confirmed against Traefik's reference
    # docs), unlike the CRD provider above. No namespaces restriction needed
    # here at all: with ingressClass set, only Ingresses whose
    # ingressClassName/annotation matches "traefik-tailnet" are processed,
    # cluster-wide — so a future app's Ingress just needs that one field set
    # to be picked up, no chart change here required. This also means the
    # main k3s Traefik needs no changes: its own ingressClass is unset,
    # which per the same docs means it only processes ingresses that are
    # unset, blank, or literally "traefik" — "traefik-tailnet" already
    # doesn't match that, so it was never going to see this one.
    kubernetesIngress:
      ingressClass: traefik-tailnet
  # Real IngressClass object needed for the ingressClassName: traefik-tailnet
  # references above to resolve properly (Traefik's own docs describe the
  # filter as matching "the IngressClass resource name"). isDefaultClass:
  # false — main Traefik's own "traefik" IngressClass is already the
  # cluster's default; every resource here sets ingressClassName explicitly
  # anyway, but two IngressClass objects both claiming default is asking for
  # ambiguity for no reason.
  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik-tailnet
  # Its own auto-generated dashboard IngressRoute (api@internal) is left
  # disabled (chart default) deliberately — api@internal always resolves to
  # whichever instance processes the route, so it's only reachable via this
  # instance's own entrypoints (i.e. only over the tailnet). The LAN debug
  # route in k3s/server/manifests/ has to reference a real Service+port
  # instead, which is what the "traefik" entrypoint override above is for.
  service:
    # Not service.type — confirmed against the chart's actual values.yaml
    # (verified after a first attempt at service.type silently did nothing
    # and defaulted to LoadBalancer, triggering k3s's servicelb to try
    # claiming node ports 443/8080 already held by the main Traefik).
    spec:
      type: ClusterIP
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: traefik-tailnet
