{{- /*
Own Certificate for memos.pi.home rather than referencing memos' existing
memos-tls secret (a different namespace) — TLS secretName cross-namespace
referencing isn't confirmed supported for IngressRoute, so this stays
same-namespace with its own cert instead of relying on that assumption.
Duplicates one cert for the same hostname (LAN vs tailnet path), a small
cost worth paying over guessing.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memos-tailnet-tls
spec:
  secretName: memos-tailnet-tls
  dnsNames:
    - memos.pi.home
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
