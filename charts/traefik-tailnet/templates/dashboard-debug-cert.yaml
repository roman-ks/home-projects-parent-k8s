{{- /*
Was a raw manifest in k3s/server/manifests/, referenced cross-namespace from
kube-system — broke when main Traefik's kubernetesCRD provider got scoped to
kube-system only (namespace scoping there gates backend Service visibility,
not just which namespaces get watched for route objects, same lesson as
memos/samba earlier). Moved here, into the same namespace as the Service it
actually fronts, and switched to a plain Ingress (dashboard-debug-ingress.yaml)
instead of IngressRoute — sidesteps the kubernetesCRD provider, and its
namespace-scoping problems, entirely.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ts-traefik-tls
spec:
  secretName: ts-traefik-tls
  dnsNames:
    - ts-traefik.pi.home
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
