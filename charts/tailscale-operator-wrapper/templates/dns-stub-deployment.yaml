apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-stub
  labels:
    app: dns-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-stub
  template:
    metadata:
      labels:
        app: dns-stub
    spec:
      containers:
        - name: dns-stub
          image: "{{ .Values.dnsStub.image.repository }}:{{ .Values.dnsStub.image.tag }}"
          # Image runs as non-root (dnsuser) but binds :53 — Docker grants
          # CAP_NET_BIND_SERVICE by default, Kubernetes doesn't always.
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          env:
            - name: HOST_MAP
              value: {{ .Values.dnsStub.hostMap | quote }}
