apiVersion: v1
kind: Service
metadata:
  name: dns-stub
  labels:
    app: dns-stub
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.dnsStub.hostname | quote }}
spec:
  selector:
    app: dns-stub
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
