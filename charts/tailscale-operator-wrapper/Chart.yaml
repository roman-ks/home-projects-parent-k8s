apiVersion: v2
name: tailscale-operator-wrapper
description: >-
  Wraps the official Tailscale k8s operator. OAuth comes from the pre-created
  operator-oauth secret (values/tailscale-oauth.enc.yaml, applied via
  `just tailscale-secret`) — see ai-fluency/tailscale-tasks.md Task 1/2.
type: application
version: 0.1.0
dependencies:
  - name: tailscale-operator
    # PLACEHOLDER — could not verify the current version without running a
    # command against the live Helm repo. Run this yourself and fill it in
    # before `helm dependency update`:
    #   helm show chart tailscale-operator --repo https://pkgs.tailscale.com/helmcharts
    version: "1.98.9"
    repository: https://pkgs.tailscale.com/helmcharts
