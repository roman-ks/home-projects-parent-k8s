apiVersion: v2
name: tailscale-operator-wrapper
description: >-
  Wraps the official Tailscale k8s operator. OAuth comes from the pre-created
  operator-oauth secret (values/tailscale-oauth.enc.yaml, applied via
  `just tailscale-secret`) — see ai-fluency/tailscale-tasks.md Task 1/2.
type: application
version: 0.1.0
dependencies:
  - name: tailscale-operator
    version: "1.104.1"
    repository: https://pkgs.tailscale.com/helmcharts
    
    # Tailnet-only Traefik instance — routes Memos (HTTPS, SNI/Host) and Samba
    # (raw TCP) through one shared tailnet address instead of a proxy per
    # service.
  - name: traefik
    version: "42.0.0"
    repository: https://traefik.github.io/charts
