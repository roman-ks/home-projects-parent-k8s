tailscale-operator:
  # No oauth.* values needed: the chart defaults to expecting a secret literally
  # named operator-oauth in the release namespace when oauth.clientId/clientSecret
  # are left unset (confirmed via `helm template` — CLIENT_ID_FILE/CLIENT_SECRET_FILE
  # point at a volume mounting that exact secret name). That's the secret Task 1
  # already created, so nothing to configure here.

  # operatorConfig.defaultTags is a real YAML list. proxyConfig.defaultTags is a
  # plain string (comma-separated for multiple tags), NOT a list — confirmed via
  # `helm template`: writing it as a list rendered literal brackets into the
  # PROXY_TAGS env var ("[tag:k8s]" instead of "tag:k8s"). Both values already
  # match the chart's own defaults — kept explicit because they have to line up
  # exactly with the tagOwners chain in the tailnet ACL ("tag:k8s-operator" owns
  # "tag:k8s"), not because the defaults might change.
  operatorConfig:
    defaultTags:
      - "tag:k8s-operator"
  proxyConfig:
    defaultTags: "tag:k8s"
    # Applies the ProxyClass below (templates/proxyclass.yaml) to every
    # Service/Ingress-created proxy by default — currently just Traefik-tailnet
    # and the dns-stub.
    defaultProxyClass: default

  # The per-app `ingressClassName: tailscale` mechanism is not used anywhere in
  # this repo (see ai-fluency/tailscale-tasks-v2.md Task 3 — it's the thing that
  # broke on SNI). Disabled so it can't be reached for by accident later and
  # rediscover the same bug.
  ingressClass:
    enabled: false

# ProxyClass (templates/proxyclass.yaml) applied to every operator-created proxy
# via proxyConfig.defaultProxyClass above. Requests only, no limits — the goal
# is just to stop the proxy being evicted/starved under pressure on a small
# Pi cluster, not to cap it; picking a limit without real load data is a guess
# we don't need to make right now.
#
# create: false by default — deliberately not applied on a normal `helm
# upgrade --install`. See the long comment in templates/proxyclass.yaml: this
# has to be a second, separate `helm upgrade --set proxyClass.create=true`
# run after the CRD from the first pass has registered, not part of the same
# install. The `tailscale-operator` justfile recipe handles both passes.
proxyClass:
  create: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Not part of the tailscale-operator subchart — our own extra templates
# (dns-stub-deployment.yaml/dns-stub-service.yaml, proxyclass.yaml) alongside
# it, same pattern as immich-wrapper's own templates/ next to the immich
# subchart. The tailnet-only Traefik instance (routing Memos/Samba) used to
# live here too but moved to its own charts/traefik-tailnet chart — bundling
# it here tangled two unrelated CRD problems (this chart's ProxyClass
# registration race, and a Traefik Hub CRD ownership conflict with k3s's own
# bundled Traefik) into one install.
dnsStub:
  image:
    repository: oci-registry.pi.home/dns-stub
    tag: "0.3.0"
  # No more per-hostname map — every current and future *.pi.home name points
  # at the same shared Traefik-tailnet target (Task 3 consolidation), so the
  # stub just answers every query with this one IP unconditionally. Adding a
  # new service (auth.pi.home, and whatever comes after it) needs zero
  # changes here — only its own second Ingress, same as Memos/Auth already
  # got. See ai-fluency/tailscale-tasks-v2.md Task 5 for why this is a direct
  # IP, not a CNAME.
  targetIP: "100.119.153.34"
  # This service's own tailnet name (needs exposure too — Split DNS points at
  # its tailnet IP, which requires it to be a tailnet member itself).
  hostname: dns-stub

traefik:
  ports:
    web:
      # Not reachable externally (expose.default: false, so it's not even on
      # the Service) — but the container still listens on it internally, so
      # anything else in the cluster reaching the pod IP directly bypasses
      # HTTPS entirely without this. Static, entrypoint-level redirect
      # (covers all traffic landing on :web regardless of Host/path) rather
      # than a per-Ingress middleware, which wouldn't catch unmatched/direct
      # traffic anyway.
      expose:
        default: false
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      exposedPort: 443
      # Entrypoint-level default middleware — applies to every router on
      # :websecure automatically (same upgrade-insecure Middleware defined
      # in templates/upgrade-insecure-middleware.yaml), so per-app tailnet
      # Ingresses don't need the router.middlewares annotation just for this.
      http:
        middlewares:
          - tailscale-upgrade-insecure@kubernetescrd
    # Non-privileged container port mapped to the privileged exposedPort via
    # the Service, same convention the chart already uses for websecure
    # (8443->443) — avoids needing NET_BIND_SERVICE for Traefik's own container.
    smb:
      port: 8445
      exposedPort: 445
      protocol: TCP
      expose:
        default: true
    # Dashboard/API entrypoint (chart default: port 8080, expose.default:
    # false). Overridden to true so it's a real port on this instance's
    # Service — needed for the main Traefik's debug route
    # (k3s/server/manifests/ts-traefik-dashboard-debug.yaml) to reach it
    # in-cluster. Not meant for LAN or tailnet use directly, though since
    # tailscale.com/expose below exposes every port on this Service, it ends
    # up tailnet-reachable too as a side effect — low-stakes (same access
    # model as everything else this instance handles), not worth a second
    # Service just to avoid.
    traefik:
      expose:
        default: true
  api:
    dashboard: true
    # api.dashboard alone doesn't serve anything — Traefik requires either
    # this, or an explicit IngressRoute referencing api@internal, to actually
    # activate the dashboard handler on the entrypoint (confirmed: dashboard
    # returned a bare 404 with just api.dashboard: true set). This instance's
    # own auto-generated dashboard IngressRoute is deliberately left disabled
    # (api@internal can't be referenced cross-instance, which is why the
    # actual debug route lives on the main Traefik instead, in
    # k3s/server/manifests/) — so nothing else activates it. insecure mode
    # (no auth) is an acceptable tradeoff here: this port isn't reachable off
    # -cluster except through the main Traefik's own SSO-gated debug route,
    # though any other pod in the cluster could reach it directly too.
    insecure: true
  providers:
    # Samba (IngressRouteTCP, a Traefik CRD) has no ingressClassName-style
    # filtering available at all — Traefik's own docs recommend namespace
    # scoping for the CRD provider specifically, confirmed via the "service
    # does not exist" error a missing namespace produced earlier for a
    # Service that demonstrably existed and had a ready endpoint. That
    # scoping affects backend Service/Endpoint visibility too, not just
    # which namespaces get watched for IngressRoute/IngressRouteTCP objects
    # — samba's namespace needs to be listed even though it has no CRD
    # objects of its own, just a plain Service allowCrossNamespace lets this
    # reference.
    kubernetesCRD:
      namespaces:
        - tailscale
        - samba
      allowCrossNamespace: true
    # Memos moved to a plain Ingress instead (charts/memos/templates/
    # tailscale-ingress.yaml) — ingressClassName filtering for plain Ingress
    # IS well-documented and reliable (confirmed against Traefik's reference
    # docs), unlike the CRD provider above. No namespaces restriction needed
    # here at all: with ingressClass set, only Ingresses whose
    # ingressClassName/annotation matches "traefik-tailnet" are processed,
    # cluster-wide — so a future app's Ingress just needs that one field set
    # to be picked up, no chart change here required. This also means the
    # main k3s Traefik needs no changes: its own ingressClass is unset,
    # which per the same docs means it only processes ingresses that are
    # unset, blank, or literally "traefik" — "traefik-tailnet" already
    # doesn't match that, so it was never going to see this one.
    kubernetesIngress:
      ingressClass: traefik-tailnet
  # Real IngressClass object needed for the ingressClassName: traefik-tailnet
  # references above to resolve properly (Traefik's own docs describe the
  # filter as matching "the IngressClass resource name"). isDefaultClass:
  # false — main Traefik's own "traefik" IngressClass is already the
  # cluster's default; every resource here sets ingressClassName explicitly
  # anyway, but two IngressClass objects both claiming default is asking for
  # ambiguity for no reason.
  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik-tailnet
  # Its own auto-generated dashboard IngressRoute (api@internal) is left
  # disabled (chart default) deliberately — api@internal always resolves to
  # whichever instance processes the route, so it's only reachable via this
  # instance's own entrypoints (i.e. only over the tailnet). The LAN debug
  # route in k3s/server/manifests/ has to reference a real Service+port
  # instead, which is what the "traefik" entrypoint override above is for.
  service:
    # Not service.type — confirmed against the chart's actual values.yaml
    # (verified after a first attempt at service.type silently did nothing
    # and defaulted to LoadBalancer, triggering k3s's servicelb to try
    # claiming node ports 443/8080 already held by the main Traefik).
    spec:
      type: ClusterIP
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: traefik-tailnet
