apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ezbookkeeping"
  labels:
    app: "ezbookkeeping"
spec:
  selector:
    matchLabels:
      app: "ezbookkeeping"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "ezbookkeeping"
    spec:
      initContainers:
        - name: fix-perms
          image: busybox
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            allowPrivelegeEscalation: false
          command:
            - sh
            - -c
            - |
              mkdir /ezbookkeeping/data
              mkdir /ezbookkeeping/storage
              chown -R 1000:1000 /ezbookkeeping/data
              chown -R 1000:1000 /ezbookkeeping/storage
              ls -l /ezbookkeeping
          volumeMounts:
          - mountPath: "/ezbookkeeping/"
            name: "ezbookkeeping-data"
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        name: "ezbookkeeping"
        command: ["sleep", "infinity"]

        env:
        - name: EBK_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "ezbookkeeping-secret"
              key: EBK_SECURITY_SECRET_KEY
        - name: EBK_SERVER_PROTOCOL
          value: "http"  # Ingress will handle HTTPS termination
        - name: EBK_SERVER_DOMAIN
          value: "ezbookkeeping.yourdomain"
        - name: EBK_SERVER_ENABLE_GZIP
          value: "true"
        - name: EBK_LOG_MODE
          value: "console" # Logs are collected from stdout/stderr in Kubernetes and can be accessed via "kubectl logs"
        ports:
        - containerPort: 8080
          name: ezbookkeeping
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "2"
        volumeMounts:
        - mountPath: "/ezbookkeeping/data" # SQLite database storage
          name: "ezbookkeeping-data"
          subpath: /data
        - mountPath: "/ezbookkeeping/storage" # User uploads storage
          name: "ezbookkeeping-data"
          subpath: /storage
      volumes:
        - name: "ezbookkeeping-data"
          persistentVolumeClaim:
            claimName: "ezbookkeeping-data"
