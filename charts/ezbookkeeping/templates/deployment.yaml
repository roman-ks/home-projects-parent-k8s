apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ezbookkeeping"
  labels:
    app: "ezbookkeeping"
spec:
  selector:
    matchLabels:
      app: "ezbookkeeping"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "ezbookkeeping"
    spec:
      initContainers:
        - name: fix-perms
          image: busybox
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivelegeEscalation: false
          command:
            - sh
            - -c
            - |
              mkdir /ezbookkeeping/data
              mkdir /ezbookkeeping/storage
              chown -R 1000:1000 /ezbookkeeping/data
              chown -R 1000:1000 /ezbookkeeping/storage
              ls -l /ezbookkeeping
          volumeMounts:
          - mountPath: "/ezbookkeeping/"
            name: "ezbookkeeping-data"
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        name: "ezbookkeeping"
        env:
        - name: EBK_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "ezbookkeeping-secret"
              key: EBK_SECURITY_SECRET_KEY
        - name: EBK_SERVER_PROTOCOL
          value: "http"  # Ingress will handle HTTPS termination
        - name: EBK_SERVER_DOMAIN
          value: {{ .Values.cname }}
        - name: EBK_SERVER_ENABLE_GZIP
          value: "true"
        - name: EBK_LOG_MODE
          value: "console" # Logs are collected from stdout/stderr in Kubernetes and can be accessed via "kubectl logs"
        - name: EBK_SERVER_ROOT_URL
          value: "https://{{ .Values.cname }}/"
        - name: EBK_AUTH_ENABLE_OAUTH2_AUTH
          value: "true"
        - name: EBK_AUTH_OAUTH2_PROVIDER
          value: oidc
        - name: EBK_AUTH_OAUTH2_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ezbookkeeping-secret
              key: EBK_AUTH_OAUTH2_CLIENT_ID
        - name: EBK_AUTH_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
            name: ezbookkeeping-secret
            key: EBK_AUTH_OAUTH2_CLIENT_SECRET
        - name: EBK_AUTH_OIDC_PROVIDER_BASE_URL
          value: {{ .Values.oidc.providerBaseUrl }}
        - name: EBK_AUTH_ENABLE_OIDC_DISPLAY_NAME
          value: "true"
        - name: EBK_AUTH_OIDC_CUSTOM_DISPLAY_NAME
          value: authentik

EBK_AUTH_OIDC_PROVIDER_BASE_URL=https://authentik.company/application/o/<application_slug>/
        ports:
        - containerPort: 8080
          name: ezbookkeeping
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "2"
        volumeMounts:
        - mountPath: "/ezbookkeeping/data" # SQLite database storage
          name: "ezbookkeeping-data"
          subPath: data
        - mountPath: "/ezbookkeeping/storage" # User uploads storage
          name: "ezbookkeeping-data"
          subPath: storage
      volumes:
        - name: "ezbookkeeping-data"
          persistentVolumeClaim:
            claimName: "ezbookkeeping-data"
