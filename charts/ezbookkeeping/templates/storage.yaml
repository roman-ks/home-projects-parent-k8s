apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ezbookkeeping-data
  labels:
    app: ezbookkeeping
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ezbookkeeping-pv
  annotations:
    # Real data (sqlite db + assets) — never touch it on uninstall.
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeClaimPolicy: Retain
  storageClassName: {{ .Values.persistence.storageClass }}
  hostPath:
    path: {{ .Values.persistence.hostPath }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: ezbookkeeping-data