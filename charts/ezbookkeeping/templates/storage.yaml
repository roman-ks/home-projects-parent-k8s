---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "ezbookkeeping-data-pvc"
  labels:
    app: "ezbookkeeping"
spec:
  storageClassName: {{ .Values.persistence.storageClass }}
  selector:
    matchLabels:
      pv-for: "ezbookkeeping-data"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistance.size }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "ezbookkeeping-storage-pvc"
  labels:
    app: "ezbookkeeping"
  annotations:
    # Real data (sqlite db + assets) — never touch it on uninstall.
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.persistence.storageClass }}
  selector:
    matchLabels:
      pv-for: "ezbookkeeping-storage"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistance.size }}
  hostPath:
    path: {{ .Values.persistence.hostPath }}