# Traefik forwardAuth middleware backed by authentik's embedded outpost
# (proxy provider `proxy-traefik-provider`, forward_domain mode). Attach it to any
# *.pi.home IngressRoute/Ingress to gate it behind authentik SSO. cookie_domain is
# pi.home, so one login covers the whole domain.
#
# Reference it:
#   - IngressRoute:  middlewares: [{name: authentik-forward-auth, namespace: kube-system}]
#   - Ingress:       traefik.ingress.kubernetes.io/router.middlewares: kube-system-authentik-forward-auth@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: kube-system
spec:
  forwardAuth:
    # Embedded outpost is served by the authentik core (server) itself.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
