apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |- 
    api: 
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - websecure
        matchRule: Host(`traefik.pi.home`)
        # Gate the dashboard behind authentik SSO (see authentik-forward-auth.yaml).
        middlewares:
          - name: authentik-forward-auth
            namespace: kube-system
        tls:
          secretName: traefik-tls
          hosts:
            - traefik.pi.home