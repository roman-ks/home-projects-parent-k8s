# Fronts the tailnet-only Traefik instance's (charts/tailscale-operator-wrapper)
# own dashboard through the main LAN Traefik, for local debugging without
# needing tailnet access. Its own auto-generated dashboard route can't be used
# for this — api@internal always resolves to whichever instance processes the
# route, so it's only reachable via that instance's own entrypoints (i.e. only
# over the tailnet). This routes to a real Service+port instead (see
# charts/tailscale-operator-wrapper/values.yaml traefik.ports.traefik).
#
# No cert-manager annotation-based issuance here (this is a raw IngressRoute,
# not an annotated Ingress cert-manager's ingress-shim watches) — explicit
# Certificate instead, same as memos-cert.yaml in the wrapper chart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ts-traefik-tls
  namespace: kube-system
spec:
  secretName: ts-traefik-tls
  dnsNames:
    - ts-traefik.pi.home
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ts-traefik-dashboard-debug
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ts-traefik.pi.home`)
      kind: Rule
      # Same SSO gate as the main dashboard's own route (see traefik-config.yaml)
      # — this shows another Traefik instance's live routing config, comparable
      # sensitivity.
      middlewares:
        - name: authentik-forward-auth
          namespace: kube-system
      services:
        - name: traefik-tailnet
          namespace: tailscale
          port: 8080
  tls:
    secretName: ts-traefik-tls
