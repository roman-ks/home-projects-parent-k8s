# Non-secret kopia config for the `immich` target — release kopia-immich.
# Secrets (bucket, S3 creds, repo password) live in values/kopia-immich.enc.yaml.
repo:
  region: us-east-1
  # Match the existing repo's identity for history continuity (compose used these).
  hostname: pi-kopia
  username: nobody
  secretName: kopia-immich-secrets

source:
  path: /data
  hostPath: /mnt/drive1/pv/immich-external

schedule: "0 3 * * *"

server:
  enabled: true
  host: kopia-immich.pi.home
