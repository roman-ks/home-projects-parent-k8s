apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: main
    path: apps/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
