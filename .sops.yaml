creation_rules:
  # immich-config: encrypt ONLY the secret-bearing values (key names are left
  # unchanged, so immich still reads `enabled`, `clientSecret`, etc.). Everything
  # else stays plaintext and diffable. First match wins, so this precedes the
  # catch-all below.
  - path_regex: 'values/immich-config\.enc\.yaml$'
    encrypted_regex: '^(password|clientId|clientSecret)$'
    age:
      - age1yubikey1qw8fz5uzfj5eayrrffqdztejc5yzjvhqahpx56lglktf0lm3g8qusuup9g8
  # Everything else: full encryption.
  - path_regex: '.*\.enc\.yaml$'
    age:
      - age1yubikey1qw8fz5uzfj5eayrrffqdztejc5yzjvhqahpx56lglktf0lm3g8qusuup9g8
