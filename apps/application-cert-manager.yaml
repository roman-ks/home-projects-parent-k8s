apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - secrets://secret.enc.yaml
    path: charts/cert-manager
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: main
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
