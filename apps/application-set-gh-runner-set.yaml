apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: arc-runners
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - runnerName: arc-runner-set-gram
        repoUrl: https://github.com/roman-ks/gram
      - runnerName: arc-runner-set-pihole
        repoUrl: https://github.com/roman-ks/pihole-controller
      - runnerName: arc-runner-set-tailscale-dns-stub
        repoUrl: https://github.com/roman-ks/tailscale-dns-stub
  template:
    metadata:
      name: '{{.runnerName}}'
    spec:
      destination:
        namespace: arc-runners
        server: https://kubernetes.default.svc
      project: default
      source:
        helm:
          valueFiles:
            - 'secrets://secret.enc.yaml'
          valuesObject:
            gha-runner-scale-set:
              githubConfigUrl: '{{.repoUrl}}'
        path: charts/gha-runner-set
        repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
        targetRevision: argocd-apps-migration
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
