apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-upgrader
spec:
  destination:
    namespace: k8s-upgrader
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.0/crd.yaml
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
