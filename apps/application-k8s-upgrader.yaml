apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-upgrader
spec:
  destination:
    namespace: k8s-upgrader
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/k3s-upgrade-controller
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: k3s-upgrade-controller
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
