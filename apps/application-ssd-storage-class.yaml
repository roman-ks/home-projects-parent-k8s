apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ssd-storage-class
  annotations: 
    argocd.argoproj.io/sync-wave: "-10" 
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/ssd-storage-class
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: sdm-bootstrap
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true