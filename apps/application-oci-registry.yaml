apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-registry
  annotations: 
    argocd.argoproj.io/sync-wave: "-4" 
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/oci-registry
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: sdm-bootstrap
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true