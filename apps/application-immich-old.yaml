apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-old
spec:
  destination:
    namespace: immich-old
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - secrets://secret.enc.yaml
      valuesObject:
        postgres:
          storage:
            name: immich-old-postgres
            path: /mnt/drive1/pv/immich-old-postgres
        storage:
          upload:
            name: immich-old-upload
          external:
            name: immich-old-external
        immich:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-server
                    tag: v3.1.0
          server:
            ingress:
              main:
                hosts:
                - host: immich-old.pi.home
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: 2283
                tls:
                  - secretName: immich-tls
                    hosts:
                      - immich-old.pi.home

          immich:
            configuration:
              oauth:
                issuerUrl: https://auth.pi.home/application/o/oidc-immich-old/.well-known/openid-configuration
              server:
                externalDomain: https://immich-old.pi.home
    path: charts/immich-wrapper
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: immich-fix
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true