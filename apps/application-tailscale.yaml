apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - gitops-values.yaml
    path: charts/tailscale-operator-wrapper
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: argocd-apps-migration
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true