apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - gitops-values.yaml
        - secrets://secret.enc.yaml
      # prevent traefik from installing CRDs, have system traefik own all CRDs. 
      # Has no effect on tailscale at it has CRDs in template/ folder 
      skipCrds: true
    path: charts/tailscale-operator-wrapper
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: k3s-upgrade-controller
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true