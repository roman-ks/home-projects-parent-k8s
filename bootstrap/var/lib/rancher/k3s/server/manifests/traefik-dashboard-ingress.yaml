# Placeholder so the pihole reconciler (Ingress-only) publishes the CNAME; real routing is the dashboard IngressRoute.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: kube-system
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  tls:
    - secretName: traefik-tls
      hosts:
        - traefik.pi.home
  rules:
    - host: traefik.pi.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 80