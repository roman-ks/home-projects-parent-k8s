apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gram-voice
spec:
  destination:
    namespace: gram
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - gitops-values.yaml
    path: charts/gram-voice
    repoURL: https://github.com/roman-ks/home-projects-parent-k8s.git
    targetRevision: gram-voice
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true